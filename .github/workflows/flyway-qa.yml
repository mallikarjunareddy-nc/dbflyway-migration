name: Flyway QA Migration

# Trigger when code is merged to main or manually
on:
  push:
    branches: [ "main" ]       # Run after PR merge
  workflow_dispatch:           # Optional manual trigger

jobs:
  migrate-qa:
    runs-on: ubuntu-latest
    name: Run Flyway migrations on QA DB

    steps:
      # Step 1: Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Run Flyway migrations using Docker
      - name: Flyway migrate on QA
        env:
          DB_USER: ${{ secrets.QA_DB_USER }}
          DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          DB_JDBC_URL: ${{ secrets.QA_DB_JDBC_URL }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/flyway/sql:/flyway/sql \
            flyway/flyway \
            -url="$DB_JDBC_URL" \
            -user="$DB_USER" \
            -password="$DB_PASSWORD" \
            migrate
